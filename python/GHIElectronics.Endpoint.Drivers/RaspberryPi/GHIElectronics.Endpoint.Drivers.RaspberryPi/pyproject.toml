[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GHIElectronics.Endpoint.Drivers.RaspberryPi"
version = "0.5.4"
description = "Raspberry Pi board support for Endpoint. One package covers every Pi model this library knows (Zero 2 W today; more added in later versions). Mirrors the .NET driver API."
authors = [{ name = "GHI Electronics, LLC", email = "support@ghielectronics.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
# GHIElectronics.Endpoint.Core provides the BoardSupport registry +
# UnknownBoardSupport base class + chip-neutral I2cController / SpiController /
# PwmController / SerialPortController. Pi driver inherits UnknownBoardSupport
# and registers Zero2WBoardSupport at import so Core's verbs dispatch to it.
dependencies = [
    "GHIElectronics.Endpoint.Core>=0.5.4,<0.6",
]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://www.ghielectronics.com/"
Repository = "https://github.com/ghi-electronics/endpoint-drivers"
Issues = "https://github.com/ghi-electronics/endpoint-drivers/issues"

[tool.setuptools.packages.find]
include = ["GHIElectronics.Endpoint.Drivers.RaspberryPi", "GHIElectronics.Endpoint.Drivers.RaspberryPi.*"]
namespaces = true

[tool.setuptools.package-data]
# Native board-support .so files bundled per arch. build_wheels.py drops
# libendpoint-zero2w-arm[64].so next to __init__.py before packaging; the
# __init__ picks the matching arch at import time and dlopens it so
# libendpoint's C++ dispatch sees Pi as the active board (fixes Python GPIO
# on Pi — the chip-neutral I2C/SPI/PWM/UART path uses the Python-side
# Zero2WBoardSupport in __init__.py and does not need the .so).
"GHIElectronics.Endpoint.Drivers.RaspberryPi" = ["libendpoint-zero2w-*.so"]
