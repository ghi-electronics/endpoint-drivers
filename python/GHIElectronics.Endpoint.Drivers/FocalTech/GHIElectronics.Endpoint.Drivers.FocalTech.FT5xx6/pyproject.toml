[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GHIElectronics.Endpoint.Drivers.FocalTech.FT5xx6"
version = "0.5.3"
description = "FocalTech FT5xx6 capacitive-touch driver for Endpoint. Mirrors the .NET driver API."
authors = [{ name = "GHI Electronics, LLC", email = "support@ghielectronics.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "GHIElectronics.Endpoint.Core>=0.5.3,<0.6",
    "GHIElectronics.Endpoint.Devices.Gpio>=0.5.3,<0.6",
    "GHIElectronics.Endpoint.Devices.I2c>=0.5.3,<0.6",
]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://www.ghielectronics.com/"
Repository = "https://github.com/ghi-electronics/endpoint-drivers"
Issues = "https://github.com/ghi-electronics/endpoint-drivers/issues"

[tool.setuptools.packages.find]
include = ["GHIElectronics.Endpoint.Drivers.FocalTech.FT5xx6", "GHIElectronics.Endpoint.Drivers.FocalTech.FT5xx6.*"]
namespaces = true
