[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GHIElectronics.Endpoint.Drivers.HiLetgo.ILI9341"
version = "0.5.2"
description = "HiLetgo ILI9341 240x320 SPI TFT driver for Endpoint. Mirrors the .NET driver API."
authors = [{ name = "GHI Electronics, LLC", email = "support@ghielectronics.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "GHIElectronics.Endpoint.Core>=0.5.2,<0.6",
    "GHIElectronics.Endpoint.Devices.Gpio>=0.5.2,<0.6",
    "GHIElectronics.Endpoint.Devices.Spi>=0.5.2,<0.6",
]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://www.ghielectronics.com/"
Repository = "https://github.com/ghi-electronics/endpoint-drivers"
Issues = "https://github.com/ghi-electronics/endpoint-drivers/issues"

[tool.setuptools.packages.find]
include = ["GHIElectronics.Endpoint.Drivers.HiLetgo.ILI9341", "GHIElectronics.Endpoint.Drivers.HiLetgo.ILI9341.*"]
namespaces = true
